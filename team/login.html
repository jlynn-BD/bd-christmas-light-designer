<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d1f3a" />
  <title>Blue Duck Design Studio — Sign in</title>
  <link rel="icon" href="/blue-duck-logo.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/team/assets/team.css" />
</head>
<body>
  <header>
    <img class="logo" src="/blue-duck-logo.png" alt="Blue Duck Christmas Lights" />
    <h1>Design Studio</h1>
    <p>Blue Duck team members only.</p>
  </header>
  <main>
    <section class="gate-panel">
      <h2>Sign in</h2>
      <p class="gate-copy">Enter the team password to create customer design concepts.</p>
      <form id="loginForm" class="team-login">
        <input type="password" id="password" autocomplete="current-password" placeholder="Team password" required autofocus />
        <button type="submit" id="loginBtn">Sign in</button>
      </form>
      <p id="loginMsg" class="gate-msg"></p>
    </section>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("loginMsg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      msg.textContent = "";
      try {
        const res = await fetch("/team/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) return location.reload();
        msg.textContent = data.error || "Couldn't sign in. Please try again.";
        msg.classList.add("error");
      } catch {
        msg.textContent = "Couldn't reach the server. Check your connection and try again.";
        msg.classList.add("error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
